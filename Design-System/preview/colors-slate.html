<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;}
  .row{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .sw{flex:1;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;font-family:var(--font-mono);font-size:11px;line-height:1.3;}
  .sw .n{font-weight:500;}
  .sw .v{opacity:.78;}
  h4{margin:0 0 10px;font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--slate-500);text-transform:uppercase;letter-spacing:.06em;}
</style></head><body>
<h4>Slate — neutrals</h4>
<div class="row">
  <div class="sw" style="background:#ffffff;color:#0f172a;border-right:1px solid var(--border)"><div class="n">white</div><div class="v">#ffffff</div></div>
  <div class="sw" style="background:#f8fafc;color:#0f172a"><div class="n">slate-50</div><div class="v">#f8fafc</div></div>
  <div class="sw" style="background:#f1f5f9;color:#0f172a"><div class="n">slate-100</div><div class="v">#f1f5f9</div></div>
  <div class="sw" style="background:#e2e8f0;color:#0f172a"><div class="n">slate-200</div><div class="v">#e2e8f0</div></div>
  <div class="sw" style="background:#cbd5e1;color:#0f172a"><div class="n">slate-300</div><div class="v">#cbd5e1</div></div>
  <div class="sw" style="background:#94a3b8;color:#fff"><div class="n">slate-400</div><div class="v">#94a3b8</div></div>
  <div class="sw" style="background:#64748b;color:#fff"><div class="n">slate-500</div><div class="v">#64748b</div></div>
  <div class="sw" style="background:#475569;color:#fff"><div class="n">slate-600</div><div class="v">#475569</div></div>
  <div class="sw" style="background:#334155;color:#fff"><div class="n">slate-700</div><div class="v">#334155</div></div>
  <div class="sw" style="background:#1e293b;color:#fff"><div class="n">slate-800</div><div class="v">#1e293b</div></div>
  <div class="sw" style="background:#0f172a;color:#fff"><div class="n">slate-900</div><div class="v">#0f172a</div></div>
</div>
</body></html>
