<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .card{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;background:#fff;}
  .lbl{font-family:var(--font-sans);font-size:11px;color:var(--fg-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;}
  pre{margin:0;font-family:var(--font-mono);font-size:13px;line-height:1.55;color:var(--slate-800);white-space:pre-wrap;}
  .vit{font-family:var(--font-mono);font-size:14px;color:var(--slate-900);}
</style></head><body>
<div class="grid">
  <div class="card">
    <div class="lbl">Mono — vitals</div>
    <div class="vit">Wt: 172 lbs<br>B/P: 150/60<br>T: 96.4 &deg;F<br>P: 72 / regular</div>
  </div>
  <div class="card">
    <div class="lbl">Mono — code/data</div>
<pre>S1, S2 without murmur
P: 2+ all around
A&amp;O x 3</pre>
  </div>
</div>
</body></html>
