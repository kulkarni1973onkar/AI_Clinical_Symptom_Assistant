<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
  .msg{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
  .av{width:28px;height:28px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .av.u{background:#e2e8f0;color:#334155;}
  .av.a{background:#0f766e;color:#fff;}
  .bub{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.55;color:var(--slate-800);max-width:520px;}
  .bub.u{background:#0f766e;border-color:#0f766e;color:#fff;}
  .cur{display:inline-block;width:8px;height:14px;background:#0f766e;vertical-align:-2px;margin-left:1px;animation:b 1.2s steps(2) infinite;}
  @keyframes b{50%{opacity:0;}}
</style></head><body>
<div class="msg"><div class="av u">JP</div><div class="bub u">What does Altace do?</div></div>
<div class="msg"><div class="av a">🩺</div><div class="bub">Altace (ramipril) is an ACE inhibitor — a blood-pressure medicine. Per <strong>MedlinePlus</strong>, it relaxes blood vessels so blood flows more easily.<span class="cur"></span></div></div>
</body></html>
