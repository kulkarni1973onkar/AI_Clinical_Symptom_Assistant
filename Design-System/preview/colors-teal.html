<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;}
  .row{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .sw{flex:1 1 0;min-width:0;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;color:#fff;font-family:var(--font-mono);font-size:11px;line-height:1.3;}
  .sw .n{font-weight:500;opacity:.95;}
  .sw .v{opacity:.78;}
  .sw.dk{color:var(--slate-900);}
  h4{margin:0 0 10px;font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--slate-500);text-transform:uppercase;letter-spacing:.06em;}
</style></head><body>
<h4>Teal — primary scale</h4>
<div class="row">
  <div class="sw dk" style="background:#f0fdfa"><div class="n">teal-50</div><div class="v">#f0fdfa</div></div>
  <div class="sw dk" style="background:#ccfbf1"><div class="n">teal-100</div><div class="v">#ccfbf1</div></div>
  <div class="sw dk" style="background:#99f6e4"><div class="n">teal-200</div><div class="v">#99f6e4</div></div>
  <div class="sw dk" style="background:#5eead4"><div class="n">teal-300</div><div class="v">#5eead4</div></div>
  <div class="sw" style="background:#2dd4bf"><div class="n">teal-400</div><div class="v">#2dd4bf</div></div>
  <div class="sw" style="background:#14b8a6"><div class="n">teal-500</div><div class="v">#14b8a6</div></div>
  <div class="sw" style="background:#0d9488"><div class="n">teal-600</div><div class="v">#0d9488</div></div>
  <div class="sw" style="background:#0f766e;outline:2px solid #0f766e;outline-offset:-2px"><div class="n">teal-700 ★</div><div class="v">#0f766e</div></div>
  <div class="sw" style="background:#115e59"><div class="n">teal-800</div><div class="v">#115e59</div></div>
  <div class="sw" style="background:#134e4a"><div class="n">teal-900</div><div class="v">#134e4a</div></div>
</div>
</body></html>
