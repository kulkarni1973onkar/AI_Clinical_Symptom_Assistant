<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px;background:#fff;display:flex;align-items:center;gap:32px;}
  .mark{display:flex;align-items:center;gap:14px;}
  .mark .sq{width:48px;height:48px;background:#0f766e;border-radius:12px;position:relative;box-shadow:0 4px 12px rgba(15,118,110,0.25);}
  .mark .sq::before,.mark .sq::after{content:'';position:absolute;background:#fff;border-radius:2px;}
  .mark .sq::before{top:14px;left:21px;width:6px;height:20px;}
  .mark .sq::after{top:21px;left:14px;width:20px;height:6px;}
  .wm{font-family:'Source Sans 3',sans-serif;font-size:26px;font-weight:600;color:#0f172a;letter-spacing:-0.3px;}
  .wm .nt{color:#0f766e;}
  .small{transform:scale(.6);transform-origin:left center;}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:8px;}
</style></head><body>
<div>
  <span class="lbl">Wordmark</span>
  <div class="mark"><div class="sq"></div><div class="wm">Med<span class="nt">Note</span></div></div>
</div>
<div>
  <span class="lbl">Mark only</span>
  <div class="mark"><div class="sq"></div></div>
</div>
<div>
  <span class="lbl">Favicon (32px)</span>
  <div class="mark"><div class="sq" style="width:32px;height:32px;border-radius:8px;"></div></div>
</div>
</body></html>
