<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px;background:#fff;font-family:var(--font-sans);display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  button{font-family:inherit;font-size:14px;font-weight:500;border-radius:6px;padding:9px 16px;cursor:pointer;transition:all 120ms cubic-bezier(0.2,0,0,1);border:1px solid transparent;}
  .primary{background:#0f766e;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 1px 2px rgba(15,23,42,0.04);}
  .primary:hover{background:#115e59;}
  .secondary{background:#fff;color:#0f766e;border-color:#cbd5e1;}
  .secondary:hover{border-color:#0f766e;background:#f0fdfa;}
  .ghost{background:transparent;color:#0f766e;}
  .ghost:hover{background:#f0fdfa;}
  .danger{background:#fff;color:#991b1b;border-color:#fecaca;}
  .disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed;}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);width:100%;margin-top:6px;text-transform:uppercase;letter-spacing:.06em;}
</style></head><body>
<div class="lbl">Buttons · primary · secondary · ghost · danger · disabled</div>
<button class="primary">Analyze document</button>
<button class="secondary">Upload another</button>
<button class="ghost">Clear session</button>
<button class="danger">Delete</button>
<button class="disabled" disabled>Processing…</button>
</body></html>
