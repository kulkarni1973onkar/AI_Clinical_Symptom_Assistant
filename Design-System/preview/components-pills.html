<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
  .group{margin-bottom:14px;}
  .lbl{font-size:13px;font-weight:600;color:var(--fg);margin-bottom:8px;display:block;}
  .pill{display:inline-block;background:#ccfbf1;color:#0f766e;padding:3px 12px;border-radius:999px;font-size:13px;margin:0 6px 6px 0;font-weight:500;}
  .pill.cond{background:#fef3c7;color:#78350f;}
  .pill.sym{background:#f1f5f9;color:#475569;}
</style></head><body>
<div class="group"><span class="lbl">Medications</span>
  <span class="pill">altace</span><span class="pill">ramipril</span><span class="pill">atorvastatin</span><span class="pill">aspirin</span>
</div>
<div class="group"><span class="lbl">Conditions</span>
  <span class="pill cond">hypertension</span><span class="pill cond">hypercholesterolemia</span><span class="pill cond">osteoarthritis</span><span class="pill cond">crohn's</span>
</div>
<div class="group"><span class="lbl">Symptoms</span>
  <span class="pill sym">fatigue</span><span class="pill sym">denies chest pain</span><span class="pill sym">denies cough</span><span class="pill sym">denies palpitations</span>
</div>
</body></html>
