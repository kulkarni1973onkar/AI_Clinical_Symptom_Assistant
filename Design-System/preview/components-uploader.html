<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
  .upl{border:2px dashed #cbd5e1;border-radius:8px;padding:24px;text-align:center;background:#f8fafc;color:var(--slate-600);transition:all 200ms;}
  .upl:hover{border-color:#0f766e;background:#f0fdfa;}
  .upl .ic{width:36px;height:36px;border-radius:8px;background:#ccfbf1;color:#0f766e;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:18px;}
  .upl h4{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--fg);}
  .upl p{margin:0;font-size:13px;color:var(--fg-muted);}
  .upl .types{margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);}
</style></head><body>
<div class="upl">
  <div class="ic">⤴</div>
  <h4>Upload a clinical note or prescription</h4>
  <p>Drop a file here, or click to browse</p>
  <div class="types">.txt · .pdf · .png · .jpg — OCR'd automatically</div>
</div>
</body></html>
