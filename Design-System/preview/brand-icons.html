<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
  .ic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--border);border-radius:8px;}
  .ic svg{width:22px;height:22px;stroke:#0f766e;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .ic .n{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
</style></head><body>
<div class="lbl">Lucide · 1.5px stroke · currentColor</div>
<div class="grid">
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/upload-cloud.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">upload</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/file-text.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">document</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/pill.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">medications</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/activity.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">conditions</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/thermometer.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">symptoms</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/search.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">evidence</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/message-square.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">chat</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/settings-2.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">settings</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/refresh-cw.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">reset</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/alert-triangle.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">warning</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/external-link.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">link</div></div>
  <div class="ic"><img src="https://unpkg.com/lucide-static@latest/icons/siren.svg" width="22" style="filter:invert(36%) sepia(76%) saturate(440%) hue-rotate(131deg) brightness(91%) contrast(91%);"><div class="n">emergency</div></div>
</div>
</body></html>
