<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:64px;height:64px;background:#0f766e;}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);text-align:center;}
  .lbl b{display:block;color:var(--fg);font-weight:500;}
</style></head><body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="lbl"><b>0</b>0px · sharp</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="lbl"><b>radius-xs</b>4px</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="lbl"><b>radius-sm</b>6px · buttons</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="lbl"><b>radius-md</b>8px · cards</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="lbl"><b>radius-lg</b>12px</div></div>
</div>
</body></html>
